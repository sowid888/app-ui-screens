name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git ffmpeg libffi-dev libssl-dev ccache zip unzip \
          openjdk-17-jdk python3-pip python3-setuptools autoconf libtool \
          pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
          cmake libgdbm-dev libnss3-dev libsqlite3-dev libreadline-dev curl \
          libbz2-dev gettext m4 autopoint libltdl-dev

    - name: Install Buildozer and Compatible Cython
      run: |
        python3 -m pip install --upgrade pip setuptools
        pip install "cython==0.29.33"
        pip install buildozer

    - name: Build APK
      env:
        CYTHON_WITHOUT_ASSERTIONS: 1
      run: |
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: bin/*.apk
